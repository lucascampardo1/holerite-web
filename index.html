<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holerite Web</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>

</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <i data-lucide="wallet"></i>
                </div>
                <h1>Holerite Web</h1>
                <p class="subtitle">Seu holerite online</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail" class="input-icon"></i>
                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                    </div>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock" class="input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                        <button type="button" class="toggle-password" id="toggleSenha" aria-label="Mostrar senha">
                            <i data-lucide="eye" class="icon-eye"></i>
                            <i data-lucide="eye-off" class="icon-eye-off"></i>
                        </button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>Lembrar da senha</span>
                    </label>
                    <a href="recuperar-senha.html" class="forgot-password">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-primary" id="btnLogin">
                    <span class="btn-text">Entrar</span>
                    <span class="btn-loader" hidden>
                        <i data-lucide="loader-2" class="spin"></i>
                    </span>
                </button>
            </form>

            <div class="alert" id="alertBox" hidden></div>
            
            <footer class="auth-footer">
                <p>&copy; 2026 Holerite Web. Todos os direitos reservados.</p>
            </footer>
        </div>
    </main>

    <script src="js/script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
